<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar · eAgora</title>
  <meta name="theme-color" content="#0694a2">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <!-- A porta (J-9, D-106): fora das oito telas, na lista aberta, sem dado nenhum. -->
  <link rel="stylesheet" href="vendor/fonts/open-sans.css">
  <script src="vendor/tailwindcss-play-3.4.16.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { primary: { 50: '#e6f7f8', 100: '#c7edf0', 600: '#0694a2', 700: '#057885', 800: '#045e68' } },
          fontFamily: { sans: ['"Open Sans"', 'ui-sans-serif', 'system-ui', '-apple-system', 'sans-serif'] },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="css/styles.css">
  <script defer src="vendor/alpinejs-3.14.3.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/entrar.js"></script>
</head>
<body class="bg-gray-50 text-gray-900">
<main x-data="portaApp()" x-init="iniciar()" class="mx-auto flex min-h-screen max-w-sm flex-col justify-center gap-4 px-4 py-8">
  <div class="text-center">
    <img src="icons/icon.svg" alt="" class="mx-auto h-14 w-14">
    <h1 class="mt-2 text-2xl font-semibold">eAgora</h1>
  </div>

  <p x-show="!suportado" class="rounded bg-amber-50 p-3 text-sm text-amber-900">Este navegador não aceita passkey. Use um navegador atual (Chrome, Safari, Edge ou Firefox).</p>

  <!-- Os 8 códigos, uma vez só (D-110) -->
  <template x-if="codigos.length">
    <section class="space-y-3 rounded border border-gray-200 bg-white p-4">
      <h2 class="font-semibold">Seus códigos de recuperação</h2>
      <p class="text-sm text-gray-700">Se você perder este aparelho, um destes códigos deixa você entrar e cadastrar outro. Cada um vale uma vez. <strong>Esta é a única vez que eles aparecem.</strong></p>
      <ol class="grid grid-cols-2 gap-2 font-mono text-sm">
        <template x-for="c in codigos" :key="c"><li class="rounded bg-gray-100 px-2 py-1 text-center" x-text="c"></li></template>
      </ol>
      <button type="button" class="min-h-11 w-full rounded border border-gray-300 text-sm" @click="copiar()" x-text="copiado ? 'Copiados' : 'Copiar os códigos'"></button>
      <p class="text-sm text-gray-700">Guarde fora deste aparelho (num gerenciador de senhas ou no papel).</p>
      <label class="flex min-h-11 items-center gap-3 text-sm"><input type="checkbox" x-model="guardei" class="h-5 w-5"> Guardei os códigos fora deste aparelho</label>
      <button type="button" class="min-h-11 w-full rounded bg-primary-600 font-semibold text-white disabled:opacity-50" :disabled="!guardei" @click="abrirApp()">Abrir o app</button>
    </section>
  </template>

  <template x-if="!codigos.length && !carregando">
    <section class="space-y-3">
      <template x-if="primeiroAcesso">
        <div class="space-y-3 rounded border border-gray-200 bg-white p-4">
          <h2 class="font-semibold">Primeiro acesso</h2>
          <p class="text-sm text-gray-700">Cadastre este aparelho com a biometria ou o PIN dele. Depois disso, este caminho fecha.</p>
          <button type="button" class="min-h-11 w-full rounded bg-primary-600 font-semibold text-white disabled:opacity-50" :disabled="trabalhando || !suportado" @click="cadastrarPrimeiro()">Cadastrar este aparelho</button>
        </div>
      </template>

      <template x-if="!primeiroAcesso && !usandoCodigo">
        <div class="space-y-3">
          <button type="button" class="min-h-12 w-full rounded bg-primary-600 text-lg font-semibold text-white disabled:opacity-50" :disabled="trabalhando || !suportado" @click="entrar()">Entrar</button>
          <button type="button" class="min-h-11 w-full text-sm text-primary-700 underline" @click="usandoCodigo = true; erro = ''">Usar código de recuperação</button>
        </div>
      </template>

      <template x-if="usandoCodigo">
        <form class="space-y-3 rounded border border-gray-200 bg-white p-4" @submit.prevent="recuperar()">
          <label class="block text-sm font-medium" for="codigo">Código de recuperação</label>
          <input id="codigo" x-model="codigo" autocomplete="one-time-code" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX-XXXX"
                 class="min-h-11 w-full rounded border border-gray-300 px-3 font-mono uppercase">
          <p class="text-xs text-gray-600">O código é consumido. Em seguida o app pede para cadastrar este aparelho.</p>
          <button type="submit" class="min-h-11 w-full rounded bg-primary-600 font-semibold text-white disabled:opacity-50" :disabled="trabalhando || codigo.length < 12">Entrar com o código</button>
          <button type="button" class="min-h-11 w-full text-sm text-gray-600 underline" @click="usandoCodigo = false; erro = ''">Voltar</button>
        </form>
      </template>

      <p x-show="!primeiroAcesso" class="text-center text-xs text-gray-500">O primeiro acesso é feito pela rede privada (tailnet).</p>
    </section>
  </template>

  <p x-show="erro" class="rounded bg-red-50 p-3 text-sm text-red-800" role="alert" x-text="erro"></p>
</main>
</body>
</html>
