<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estudos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Paleta (docs/04_FRONTEND.md §8A) — extraída do qconcursos.com, cor
    // por papel funcional, não um único "brand color". Trocar a paleta
    // depois é editar só este bloco: todo o resto do HTML usa os nomes
    // (primary/alerta), nunca hex direto.
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { 50: '#e6f7f8', 100: '#c7edf0', 600: '#0694a2', 700: '#057885', 800: '#045e68' },
            alerta: { 50: '#fff4ed', 600: '#fe6112', 700: '#e2530a' },
          },
          fontFamily: {
            sans: ['"Open Sans"', 'ui-sans-serif', 'system-ui', '-apple-system', 'sans-serif'],
          },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="css/styles.css">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.3/dist/cdn.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/pages.js"></script>
  <script src="js/router.js"></script>
</head>
<body class="bg-gray-50 text-gray-900">

<header class="flex items-center justify-between border-b border-gray-200 bg-white px-4 py-3">
  <a href="#/hoje" class="text-lg font-semibold">Estudos</a>
  <nav class="flex gap-4">
    <a href="#/assuntos" class="text-sm text-gray-500 hover:text-gray-900">Assuntos</a>
    <a href="#/progresso" class="text-sm text-gray-500 hover:text-gray-900">Progresso</a>
    <a href="#/ajustes" class="text-sm text-gray-500 hover:text-gray-900">Ajustes</a>
  </nav>
</header>

<main class="mx-auto max-w-md px-4 py-6">

  <!-- Tela Hoje — porta de entrada, J-2/J-4 (04_FRONTEND.md §6) -->
  <section id="pagina-hoje" x-data="paginaHoje()">

    <template x-if="carregando">
      <p class="text-gray-500">Carregando...</p>
    </template>

    <template x-if="!carregando && erro">
      <div class="rounded border border-red-300 bg-red-50 p-4 text-red-700">
        <p x-text="erro"></p>
        <button type="button" class="mt-2 underline" @click="init()">Tentar de novo</button>
      </div>
    </template>

    <template x-if="!carregando && !erro && vazio">
      <p class="text-gray-500">Nada para hoje. Volte amanhã.</p>
    </template>

    <template x-if="!carregando && !erro && !vazio">
      <div class="space-y-6">
        <div x-show="fila.length > 0">
          <h2 class="mb-2 text-sm font-medium text-gray-500">Recuperar</h2>
          <ul class="space-y-2">
            <template x-for="item in fila" :key="item.assuntoId">
              <li>
                <button
                  type="button"
                  class="w-full rounded border border-gray-200 bg-white p-3 text-left hover:bg-gray-50"
                  @click="abrirRecuperacao(item)">
                  <span class="block font-medium" x-text="item.nome"></span>
                  <span class="text-sm text-gray-500" x-text="'Nível ' + item.nivel"></span>
                </button>
              </li>
            </template>
          </ul>
        </div>

        <div x-show="blocoConteudo">
          <h2 class="mb-2 text-sm font-medium text-gray-500">Conteúdo novo</h2>
          <button
            type="button"
            class="w-full rounded border border-gray-200 bg-white p-3 text-left hover:bg-gray-50"
            @click="abrirRegistroConteudo(blocoConteudo)">
            <span class="block font-medium" x-text="blocoConteudo?.nome"></span>
          </button>
        </div>
      </div>
    </template>
  </section>

  <!-- Tela Recuperar — única com sequência vinculante (04_FRONTEND.md §7, 02_JORNADAS §4.1) -->
  <section id="pagina-recuperar" x-data="paginaRecuperar()" hidden>

    <template x-if="semDados">
      <div class="rounded border border-red-300 bg-red-50 p-4 text-red-700">
        <p>Não foi possível abrir esta recuperação.</p>
        <a href="#/hoje" class="mt-2 inline-block underline">Voltar para Hoje</a>
      </div>
    </template>

    <template x-if="!semDados && erro">
      <div class="mb-4 rounded border border-red-300 bg-red-50 p-4 text-red-700">
        <p x-text="erro"></p>
        <button type="button" class="mt-2 underline" :disabled="enviando" @click="reenviar()">Reenviar</button>
      </div>
    </template>

    <!-- Etapa 1: sem campo de resultado no DOM — nunca escondido, ausente (regra vinculante) -->
    <template x-if="!semDados && etapa === 1">
      <div class="space-y-4">
        <div>
          <h2 class="text-lg font-semibold" x-text="nome"></h2>
          <p class="text-sm text-gray-500"
             x-text="'Nível ' + nivel + (dataPrevista ? ' · previsto para ' + dataPrevista : '')"></p>
        </div>

        <p class="font-medium">O que você espera?</p>
        <div class="space-y-2">
          <button type="button" class="w-full rounded border border-gray-200 bg-white p-3 text-left hover:bg-gray-50" @click="prever('SUCESSO')">Vou reconstruir</button>
          <button type="button" class="w-full rounded border border-gray-200 bg-white p-3 text-left hover:bg-gray-50" @click="prever('PARCIAL')">Vai faltar um pedaço</button>
          <button type="button" class="w-full rounded border border-gray-200 bg-white p-3 text-left hover:bg-gray-50" @click="prever('FALHA')">Não vai vir</button>
        </div>

        <p class="text-sm text-gray-500">Feche o material e reconstrua de memória.</p>
      </div>
    </template>

    <!-- Etapa 2: previsão mostrada, não editável (regra vinculante) -->
    <template x-if="!semDados && etapa === 2">
      <div class="space-y-4">
        <h2 class="text-lg font-semibold" x-text="nome"></h2>
        <p class="text-sm text-gray-500">
          Você previu:
          <span x-text="{SUCESSO: 'vou reconstruir', PARCIAL: 'vai faltar um pedaço', FALHA: 'não vai vir'}[previsao]"></span>
        </p>

        <p class="font-medium">Conseguiu reconstruir?</p>
        <div class="space-y-2">
          <button type="button" class="w-full rounded border border-gray-200 bg-white p-3 text-left hover:bg-gray-50" :disabled="enviando" @click="confirmar('SUCESSO')">
            <span class="block">Reconstruí</span>
            <span class="text-sm text-gray-500">os pontos principais vieram; faltou detalhe, não estrutura</span>
          </button>
          <button type="button" class="w-full rounded border border-gray-200 bg-white p-3 text-left hover:bg-gray-50" :disabled="enviando" @click="confirmar('PARCIAL')">
            <span class="block">Faltou um pedaço</span>
            <span class="text-sm text-gray-500">a estrutura veio, mas um bloco inteiro não</span>
          </button>
          <button type="button" class="w-full rounded border border-gray-200 bg-white p-3 text-left hover:bg-gray-50" :disabled="enviando" @click="confirmar('FALHA')">
            <span class="block">Não veio</span>
            <span class="text-sm text-gray-500">preciso reler antes de tentar de novo</span>
          </button>
        </div>

        <button type="button" class="text-sm text-gray-500 underline" @click="abrirErro()">+ registrar um erro</button>
      </div>
    </template>
  </section>

  <!-- Tela Registrar sessão — Conteúdo/Questões/Flashcards (04_FRONTEND.md §7A) -->
  <section id="pagina-registrar" x-data="paginaRegistrar()" hidden>

    <template x-if="semDados">
      <div class="rounded border border-red-300 bg-red-50 p-4 text-red-700">
        <p>Não foi possível abrir este registro.</p>
        <a href="#/hoje" class="mt-2 inline-block underline">Voltar para Hoje</a>
      </div>
    </template>

    <template x-if="!semDados">
      <div class="space-y-5">
        <template x-if="erro">
          <div class="rounded border border-red-300 bg-red-50 p-4 text-red-700">
            <p x-text="erro"></p>
            <button type="button" class="mt-2 underline" :disabled="enviando" @click="registrar()">Reenviar</button>
          </div>
        </template>

        <h2 class="text-lg font-semibold" x-text="nome"></h2>

        <!-- Seletor de tipo — troca de forma, nunca de rota (§7A) -->
        <div class="flex gap-2">
          <button type="button"
            class="rounded-full px-3 py-1 text-sm"
            :class="tipo === 'conteudo' ? 'bg-primary-600 text-white' : 'border border-gray-200 bg-white text-gray-700'"
            @click="selecionarTipo('conteudo')">Conteúdo</button>
          <button type="button"
            class="rounded-full px-3 py-1 text-sm"
            :class="tipo === 'questoes' ? 'bg-primary-600 text-white' : 'border border-gray-200 bg-white text-gray-700'"
            @click="selecionarTipo('questoes')">Questões</button>
          <button type="button"
            class="rounded-full px-3 py-1 text-sm"
            :class="tipo === 'flashcards' ? 'bg-primary-600 text-white' : 'border border-gray-200 bg-white text-gray-700'"
            @click="selecionarTipo('flashcards')">Flashcards</button>
        </div>

        <!-- Segmento: ausente do DOM quando o assunto não tem nenhum, não desabilitado -->
        <div x-show="tipo === 'conteudo' && temSegmentos">
          <label class="mb-1 block text-sm font-medium text-gray-500">Segmento (opcional)</label>
          <select x-model="segmentoId" class="w-full rounded border border-gray-200 bg-white p-2">
            <option value="">Nenhum em especial</option>
            <template x-for="s in segmentos" :key="s.id">
              <option :value="s.id" x-text="s.ordem + '. ' + s.arquivo"></option>
            </template>
          </select>
        </div>

        <div x-show="tipo === 'questoes'">
          <label class="mb-1 block text-sm font-medium text-gray-500">Formato da banca</label>
          <div class="flex gap-2">
            <button type="button"
              class="rounded-full px-3 py-1 text-sm"
              :class="formato === 'MULTIPLA_ESCOLHA' ? 'bg-primary-600 text-white' : 'border border-gray-200 bg-white text-gray-700'"
              @click="formato = 'MULTIPLA_ESCOLHA'">Múltipla escolha</button>
            <button type="button"
              class="rounded-full px-3 py-1 text-sm"
              :class="formato === 'CERTO_ERRADO' ? 'bg-primary-600 text-white' : 'border border-gray-200 bg-white text-gray-700'"
              @click="formato = 'CERTO_ERRADO'">Certo/errado</button>
          </div>
        </div>

        <div x-show="tipo === 'questoes' || tipo === 'flashcards'" class="flex gap-3">
          <div class="flex-1">
            <label class="mb-1 block text-sm font-medium text-gray-500" x-text="tipo === 'questoes' ? 'Questões feitas' : 'Cartões feitos'"></label>
            <input type="number" min="1" x-model="feitas" class="w-full rounded border border-gray-200 bg-white p-2">
          </div>
          <div class="flex-1">
            <label class="mb-1 block text-sm font-medium text-gray-500">Acertos</label>
            <input type="number" min="0" x-model="certas" class="w-full rounded border border-gray-200 bg-white p-2">
          </div>
        </div>

        <div x-show="tipo === 'questoes' || tipo === 'flashcards'">
          <label class="mb-1 block text-sm font-medium text-gray-500">Previsão de acerto antes de ver o resultado (%)</label>
          <input type="number" min="0" max="100" x-model="previsao" class="w-full rounded border border-gray-200 bg-white p-2">
        </div>

        <button type="button" class="w-full rounded bg-primary-600 p-3 text-center font-medium text-white hover:bg-primary-700" :disabled="enviando" @click="registrar()">Registrar</button>
      </div>
    </template>
  </section>

  <!-- Tela Assuntos — lista por disciplina (04_FRONTEND.md §7B) -->
  <section id="pagina-assuntos" x-data="paginaAssuntos()" hidden>

    <template x-if="carregando">
      <p class="text-gray-500">Carregando...</p>
    </template>

    <template x-if="!carregando && erro">
      <div class="rounded border border-red-300 bg-red-50 p-4 text-red-700">
        <p x-text="erro"></p>
        <button type="button" class="mt-2 underline" @click="init()">Tentar de novo</button>
      </div>
    </template>

    <template x-if="!carregando && !erro && vazio">
      <p class="text-gray-500">Nenhum assunto ativo ainda.</p>
    </template>

    <template x-if="!carregando && !erro && !vazio">
      <div class="space-y-6">
        <template x-for="grupo in grupos" :key="grupo.disciplina.id">
          <div x-show="grupo.assuntos.length > 0">
            <h2 class="mb-2 text-sm font-medium text-gray-500" x-text="grupo.disciplina.nome"></h2>
            <ul class="space-y-2">
              <template x-for="assunto in grupo.assuntos" :key="assunto.id">
                <li>
                  <button type="button" @click="abrirDetalhe(grupo.disciplina, assunto)"
                     class="block w-full rounded border border-gray-200 bg-white p-3 text-left hover:bg-gray-50">
                    <span class="block font-medium" x-text="assunto.ordem + '. ' + assunto.nome"></span>
                    <span class="mt-1 flex gap-2">
                      <span class="rounded-full px-2 py-0.5 text-xs font-medium"
                            :class="{ALTO: 'bg-alerta-50 text-alerta-600', MEDIO: 'bg-amber-100 text-amber-800', BAIXO: 'bg-gray-200 text-gray-700'}[assunto.peso]"
                            x-text="{ALTO: 'Alto', MEDIO: 'Médio', BAIXO: 'Baixo'}[assunto.peso]"></span>
                      <span class="rounded-full px-2 py-0.5 text-xs font-medium"
                            :class="{BACKLOG: 'bg-gray-100 text-gray-500', FRENTE: 'bg-primary-100 text-primary-800', CONSOLIDADO: 'bg-green-100 text-green-800'}[assunto.fase]"
                            x-text="{BACKLOG: 'Backlog', FRENTE: 'Frente', CONSOLIDADO: 'Consolidado'}[assunto.fase]"></span>
                    </span>
                  </button>
                </li>
              </template>
            </ul>
          </div>
        </template>
      </div>
    </template>
  </section>

  <!-- Tela Assunto detalhe — segmentos + entrada pra Registrar (04_FRONTEND.md §7B) -->
  <section id="pagina-assunto-detalhe" x-data="paginaAssuntoDetalhe()" hidden>

    <template x-if="semDados">
      <div class="rounded border border-red-300 bg-red-50 p-4 text-red-700">
        <p>Não foi possível abrir este assunto.</p>
        <a href="#/assuntos" class="mt-2 inline-block underline">Voltar para Assuntos</a>
      </div>
    </template>

    <template x-if="!semDados && carregando">
      <p class="text-gray-500">Carregando...</p>
    </template>

    <template x-if="!semDados && !carregando">
      <div class="space-y-5">
        <div>
          <p class="text-sm text-gray-400" x-text="disciplinaNome"></p>
          <h2 class="text-lg font-semibold" x-text="nome"></h2>
          <span class="mt-1 flex gap-2">
            <span class="rounded-full px-2 py-0.5 text-xs font-medium"
                  :class="{ALTO: 'bg-alerta-50 text-alerta-600', MEDIO: 'bg-amber-100 text-amber-800', BAIXO: 'bg-gray-200 text-gray-700'}[peso]"
                  x-text="{ALTO: 'Alto', MEDIO: 'Médio', BAIXO: 'Baixo'}[peso]"></span>
            <span class="rounded-full px-2 py-0.5 text-xs font-medium"
                  :class="{BACKLOG: 'bg-gray-100 text-gray-500', FRENTE: 'bg-primary-100 text-primary-800', CONSOLIDADO: 'bg-green-100 text-green-800'}[fase]"
                  x-text="{BACKLOG: 'Backlog', FRENTE: 'Frente', CONSOLIDADO: 'Consolidado'}[fase]"></span>
          </span>
        </div>

        <div class="flex gap-2">
          <button type="button" @click="irRegistrar('conteudo')" class="flex-1 rounded border border-gray-200 bg-white p-2 text-center text-sm hover:bg-gray-50">Conteúdo</button>
          <button type="button" @click="irRegistrar('questoes')" class="flex-1 rounded border border-gray-200 bg-white p-2 text-center text-sm hover:bg-gray-50">Questões</button>
          <button type="button" @click="irRegistrar('flashcards')" class="flex-1 rounded border border-gray-200 bg-white p-2 text-center text-sm hover:bg-gray-50">Flashcards</button>
          <button type="button" @click="irErros()" class="flex-1 rounded border border-gray-200 bg-white p-2 text-center text-sm hover:bg-gray-50">Erros</button>
        </div>

        <div x-show="temSegmentos" class="space-y-2">
          <h3 class="text-sm font-medium text-gray-500">Material</h3>
          <ul class="space-y-2">
            <template x-for="s in segmentos" :key="s.id">
              <li class="rounded border border-gray-200 bg-white p-3">
                <div class="flex items-center justify-between gap-2">
                  <span class="text-sm" x-text="s.ordem + '. p. ' + (s.paginaInicial ?? '?') + '–' + (s.paginaFinal ?? '?')"></span>
                  <span class="text-xs text-gray-400" x-text="s.tempoEstimadoMin ? '~' + s.tempoEstimadoMin + ' min' : ''"></span>
                </div>
                <a :href="s.arquivo" target="_blank" rel="noopener" class="text-sm underline">abrir material</a>
              </li>
            </template>
          </ul>
        </div>

        <!-- M-2, adicionado na Sprint 14 (04_FRONTEND.md §7B/§7D) -->
        <div x-show="temRetencao" class="space-y-2">
          <h3 class="text-sm font-medium text-gray-500">Retenção</h3>
          <ul class="space-y-2">
            <template x-for="s in retencao" :key="s.tipo">
              <li class="rounded border border-gray-200 bg-white p-3">
                <p class="text-sm font-medium" x-text="{ESTUDO: 'Conteúdo', QUESTOES: 'Questões', FLASHCARDS: 'Flashcards', RECUPERACAO: 'Recuperação'}[s.tipo]"></p>
                <p class="text-sm text-gray-500">
                  <span x-text="'1ª exposição: ' + (s.percentualPrimeira === null ? '—' : Math.round(s.percentualPrimeira) + '%')"></span>
                  <span x-show="s.percentualMediaSeguintes !== null" x-text="' · depois: ' + Math.round(s.percentualMediaSeguintes) + '%'"></span>
                </p>
              </li>
            </template>
          </ul>
        </div>
      </div>
    </template>
  </section>

  <!-- Tela Erros — formulário + consulta por assunto (04_FRONTEND.md §7C) -->
  <section id="pagina-erros" x-data="paginaErros()" hidden>

    <template x-if="semDados">
      <div class="rounded border border-red-300 bg-red-50 p-4 text-red-700">
        <p>Não foi possível abrir os erros deste assunto.</p>
        <a href="#/assuntos" class="mt-2 inline-block underline">Voltar para Assuntos</a>
      </div>
    </template>

    <template x-if="!semDados">
      <div class="space-y-6">
        <div class="space-y-4">
          <h2 class="text-lg font-semibold" x-text="nome"></h2>

          <template x-if="erroEnvio">
            <div class="rounded border border-red-300 bg-red-50 p-4 text-red-700">
              <p x-text="erroEnvio"></p>
            </div>
          </template>

          <div>
            <label class="mb-1 block text-sm font-medium text-gray-500">O que aconteceu?</label>
            <textarea x-model="descricao" rows="3" class="w-full rounded border border-gray-200 bg-white p-2"></textarea>
          </div>

          <div>
            <label class="mb-1 block text-sm font-medium text-gray-500">Causa</label>
            <div class="flex flex-wrap gap-2">
              <button type="button" class="rounded-full px-3 py-1 text-sm" :class="causa === 'FALTA_CONHECIMENTO' ? 'bg-primary-600 text-white' : 'border border-gray-200 bg-white text-gray-700'" @click="causa = 'FALTA_CONHECIMENTO'">Falta de conhecimento</button>
              <button type="button" class="rounded-full px-3 py-1 text-sm" :class="causa === 'ESQUECIMENTO' ? 'bg-primary-600 text-white' : 'border border-gray-200 bg-white text-gray-700'" @click="causa = 'ESQUECIMENTO'">Esquecimento</button>
              <button type="button" class="rounded-full px-3 py-1 text-sm" :class="causa === 'INTERPRETACAO' ? 'bg-primary-600 text-white' : 'border border-gray-200 bg-white text-gray-700'" @click="causa = 'INTERPRETACAO'">Interpretação</button>
              <button type="button" class="rounded-full px-3 py-1 text-sm" :class="causa === 'DESATENCAO' ? 'bg-primary-600 text-white' : 'border border-gray-200 bg-white text-gray-700'" @click="causa = 'DESATENCAO'">Desatenção</button>
              <button type="button" class="rounded-full px-3 py-1 text-sm" :class="causa === 'PEGADINHA' ? 'bg-primary-600 text-white' : 'border border-gray-200 bg-white text-gray-700'" @click="causa = 'PEGADINHA'">Pegadinha</button>
              <button type="button" class="rounded-full px-3 py-1 text-sm" :class="causa === 'CHUTE' ? 'bg-primary-600 text-white' : 'border border-gray-200 bg-white text-gray-700'" @click="causa = 'CHUTE'">Chute</button>
              <button type="button" class="rounded-full px-3 py-1 text-sm" :class="causa === 'GESTAO_TEMPO' ? 'bg-primary-600 text-white' : 'border border-gray-200 bg-white text-gray-700'" @click="causa = 'GESTAO_TEMPO'">Gestão de tempo</button>
            </div>
          </div>

          <div>
            <label class="mb-1 block text-sm font-medium text-gray-500">Você tinha certeza quando errou?</label>
            <div class="flex gap-2">
              <button type="button" class="rounded-full px-3 py-1 text-sm" :class="confianca === 'BAIXA' ? 'bg-primary-600 text-white' : 'border border-gray-200 bg-white text-gray-700'" @click="confianca = 'BAIXA'">Baixa</button>
              <button type="button" class="rounded-full px-3 py-1 text-sm" :class="confianca === 'MEDIA' ? 'bg-primary-600 text-white' : 'border border-gray-200 bg-white text-gray-700'" @click="confianca = 'MEDIA'">Média</button>
              <button type="button" class="rounded-full px-3 py-1 text-sm" :class="confianca === 'ALTA' ? 'bg-primary-600 text-white' : 'border border-gray-200 bg-white text-gray-700'" @click="confianca = 'ALTA'">Alta</button>
            </div>
          </div>

          <button type="button" class="w-full rounded bg-primary-600 p-3 text-center font-medium text-white hover:bg-primary-700" :disabled="enviando" @click="registrar()">Registrar</button>
        </div>

        <div class="space-y-2 border-t border-gray-200 pt-4">
          <h3 class="text-sm font-medium text-gray-500">Erros deste assunto</h3>

          <template x-if="carregandoLista">
            <p class="text-gray-500">Carregando...</p>
          </template>

          <template x-if="!carregandoLista && erros.length === 0">
            <p class="text-gray-500">Nenhum erro registrado ainda.</p>
          </template>

          <ul class="space-y-2">
            <template x-for="e in erros" :key="e.id">
              <li class="rounded border border-gray-200 bg-white p-3">
                <p class="text-sm" x-text="e.descricao"></p>
                <div class="mt-1 flex gap-2">
                  <span class="rounded-full bg-gray-100 px-2 py-0.5 text-xs text-gray-700"
                        x-text="{FALTA_CONHECIMENTO: 'Falta de conhecimento', ESQUECIMENTO: 'Esquecimento', INTERPRETACAO: 'Interpretação', DESATENCAO: 'Desatenção', PEGADINHA: 'Pegadinha', CHUTE: 'Chute', GESTAO_TEMPO: 'Gestão de tempo'}[e.causa]"></span>
                  <span class="rounded-full bg-gray-100 px-2 py-0.5 text-xs text-gray-700"
                        x-text="'confiança ' + {BAIXA: 'baixa', MEDIA: 'média', ALTA: 'alta'}[e.confianca]"></span>
                </div>
              </li>
            </template>
          </ul>
        </div>
      </div>
    </template>
  </section>

  <!-- Tela Progresso — M-1/M-3/M-4 globais (04_FRONTEND.md §7D; M-2 mora no detalhe de Assuntos) -->
  <section id="pagina-progresso" x-data="paginaProgresso()" hidden>

    <template x-if="carregando">
      <p class="text-gray-500">Carregando...</p>
    </template>

    <template x-if="!carregando && erro">
      <div class="rounded border border-red-300 bg-red-50 p-4 text-red-700">
        <p x-text="erro"></p>
        <button type="button" class="mt-2 underline" @click="init()">Tentar de novo</button>
      </div>
    </template>

    <template x-if="!carregando && !erro">
      <div class="space-y-6">
        <div class="space-y-2">
          <div class="flex items-center justify-between">
            <h2 class="text-sm font-medium text-gray-500">M-1 · Aderência ao objetivo</h2>
            <div class="flex gap-2">
              <button type="button" class="rounded-full px-3 py-1 text-sm" :class="janela === 'GLOBAL' ? 'bg-primary-600 text-white' : 'border border-gray-200 bg-white text-gray-700'" @click="trocarJanela('GLOBAL')">Global</button>
              <button type="button" class="rounded-full px-3 py-1 text-sm" :class="janela === 'POR_DISCIPLINA' ? 'bg-primary-600 text-white' : 'border border-gray-200 bg-white text-gray-700'" @click="trocarJanela('POR_DISCIPLINA')">Por disciplina</button>
            </div>
          </div>
          <ul class="space-y-2">
            <template x-for="linha in m1.linhas" :key="(linha.disciplinaId ?? 'global') + '-' + linha.formato">
              <li class="rounded border border-gray-200 bg-white p-3">
                <div class="flex items-baseline justify-between">
                  <span class="font-medium" x-text="rotuloLinha(linha) + ' · ' + {MULTIPLA_ESCOLHA: 'Múltipla escolha', CERTO_ERRADO: 'Certo/errado'}[linha.formato]"></span>
                  <span class="text-lg font-semibold" x-text="linha.percentual === null ? '—' : Math.round(linha.percentual) + '%'"></span>
                </div>
                <div class="mt-1 flex items-center gap-2 text-sm text-gray-500">
                  <span x-text="linha.acertos + '/' + linha.total"></span>
                  <span x-show="linha.confiavel" class="rounded-full bg-gray-100 px-2 py-0.5 text-xs">amostra grande</span>
                </div>
              </li>
            </template>
          </ul>
        </div>

        <div class="space-y-2 border-t border-gray-200 pt-4">
          <h2 class="text-sm font-medium text-gray-500">M-3 · Calibração</h2>
          <div class="rounded border border-gray-200 bg-white p-3">
            <p class="text-sm text-gray-500">Objetiva (questões/flashcards)</p>
            <p class="font-semibold" x-text="m3.objetiva.n === 0 ? 'sem dados ainda' : (Math.round(Math.abs(m3.objetiva.mediaDesvio)) + ' pts — ' + (m3.objetiva.mediaDesvio > 0 ? 'superestimou' : m3.objetiva.mediaDesvio < 0 ? 'subestimou' : 'sem desvio'))"></p>
          </div>
          <div class="rounded border border-gray-200 bg-white p-3">
            <p class="text-sm text-gray-500">Subjetiva (recuperação)</p>
            <p class="font-semibold" x-text="m3.subjetiva.n === 0 ? 'sem dados ainda' : (m3.subjetiva.superestimou + ' superestimou · ' + m3.subjetiva.subestimou + ' subestimou · ' + m3.subjetiva.acertouPrevisao + ' acertou')"></p>
          </div>
        </div>

        <div class="space-y-2 border-t border-gray-200 pt-4">
          <h2 class="text-sm font-medium text-gray-500">M-4 · Aderência ao prazo</h2>
          <div class="rounded border border-gray-200 bg-white p-3">
            <p class="font-semibold" x-text="(m4.percentual === null ? '—' : Math.round(m4.percentual) + '%') + ' em até 3 dias do previsto'"></p>
            <p class="text-sm text-gray-500" x-text="m4.dentroDoPrazo + '/' + m4.totalCumpridas"></p>
          </div>
        </div>
      </div>
    </template>
  </section>

  <!-- Tela Ajustes — os 18 parâmetros, editáveis (04_FRONTEND.md §7E) -->
  <section id="pagina-ajustes" x-data="paginaAjustes()" hidden>

    <template x-if="carregando">
      <p class="text-gray-500">Carregando...</p>
    </template>

    <template x-if="!carregando && erro">
      <div class="rounded border border-red-300 bg-red-50 p-4 text-red-700">
        <p x-text="erro"></p>
        <button type="button" class="mt-2 underline" @click="init()">Tentar de novo</button>
      </div>
    </template>

    <template x-if="!carregando && !erro">
      <div class="space-y-6">
        <template x-for="grupo in grupos" :key="grupo.nome">
          <div class="space-y-1">
            <h2 class="text-xs font-semibold uppercase tracking-wide text-gray-500" x-text="grupo.nome"></h2>
            <template x-for="p in grupo.itens" :key="p.chave">
              <div class="flex items-center justify-between border-b border-gray-100 py-2">
                <div>
                  <span class="text-sm" x-text="rotulo(p.chave)"></span>
                  <p x-show="erroPorChave[p.chave]" class="text-xs text-red-600" x-text="erroPorChave[p.chave]"></p>
                </div>
                <input
                  type="text" inputmode="decimal"
                  class="w-20 rounded border border-gray-200 bg-white p-1.5 text-right text-sm"
                  :class="salvando[p.chave] ? 'opacity-50' : ''"
                  :disabled="salvando[p.chave]"
                  x-model="draft[p.chave]"
                  @change="salvar(p, draft[p.chave])">
              </div>
            </template>
          </div>
        </template>
      </div>
    </template>
  </section>

</main>
</body>
</html>
