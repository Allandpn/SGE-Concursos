# =============================================================================
# Fonte: docker-compose.yml (variáveis DB_URL, DB_USER, DB_PASSWORD,
# BIND_ADDRESS, LOG_LEVEL) e docs/03E_DEPLOYMENT.md §4.2.
#
# 03A_CONFIGURATION.md, citado no pom.xml como origem deste arquivo, é um dos
# nove documentos técnicos que não sobreviveram ao reset da especificação
# (ver CLAUDE.md). Este application.yml nasce direto das variáveis já fixadas
# no compose e do ADR-017 — não há doc técnico de configuração vigente ainda.
# =============================================================================

server:
  port: 8080
  # ADR-038: o manifesto do app instalável precisa do tipo certo, senão
  # o navegador ignora o arquivo e não oferece "instalar".
  mime-mappings:
    webmanifest: application/manifest+json
  # BIND_ADDRESS=0.0.0.0 dentro do container é obrigatório para o Docker
  # mapear a porta; o confinamento real vem do "127.0.0.1:" do host no
  # docker-compose.yml. Não "corrigir" para um valor fixo.
  address: ${BIND_ADDRESS:127.0.0.1}

spring:
  servlet:
    multipart:
      # ADR-043: o PDF do edital passa por aqui (o padrão de 1 MB recusaria
      # quase todo edital). Os CSVs de importação continuam pequenos.
      max-file-size: 30MB
      max-request-size: 31MB
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    # ADR-034: sessão do Hibernate fecha ao sair do Service, não fica aberta
    # até a serialização da view. Associação LAZY sem "join fetch" na consulta
    # que o DTO usa quebra aqui, não em produção sob carga.
    open-in-view: false
    hibernate:
      # ADR-017: nunca update, nunca create-drop. O schema nasce só de
      # migração Flyway; validate transforma divergência entidade↔schema em
      # erro na subida.
      ddl-auto: validate

# ADR-043 — análise de edital por IA via OpenRouter (docs/SPRINT-18-CONCURSOS.md §4.3).
estudos:
  ia:
    chave: ${OPENROUTER_API_KEY:}
    modelo: ${OPENROUTER_MODEL:anthropic/claude-sonnet-5.5}
    url-base: ${OPENROUTER_URL:https://openrouter.ai/api/v1}
    # Testes rodam a análise na própria thread da requisição.
    sincrono: false
  # ADR-044 — o planejamento roda ao lado, no mesmo compose
  # (docs/SPRINT-19-MATERIAL-AUTOMATICO.md §4 e §6). Sem token, /internal/** fica desligado.
  interno:
    token: ${INTERNAL_TOKEN:}
  material:
    dir: ${MATERIAL_DIR:/dados/material}
  provas:
    dir: ${PROVAS_DIR:/dados/provas}

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    root: ${LOG_LEVEL:INFO}
