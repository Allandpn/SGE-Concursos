# =============================================================================
# Fonte: 03E_DEPLOYMENT.md §4.2
#
# TRÊS LINHAS DE SEGURANÇA (§4.3). Não "corrija" nenhuma delas:
#
#  1. app.ports = "127.0.0.1:8080:8080"
#     O serviço só é alcançável pelo próprio host. Sem o prefixo, a porta fica
#     aberta para TODA a rede local — e a aplicação NÃO tem autenticação
#     (ADR-015). O acesso de outros dispositivos vem da Tailscale (§4.4).
#
#  2. postgres SEM `ports:`
#     O banco só existe dentro da rede do Compose. Nunca exposto, nem ao host.
#
#  3. app.BIND_ADDRESS = 0.0.0.0
#     Parece contradizer o item 1, e não contradiz: DENTRO do contêiner é
#     obrigatório para o Docker conseguir mapear a porta. O confinamento é
#     feito pelo `127.0.0.1:` do lado do host. É a confusão mais comum de
#     Docker + Spring.
#
# PI 4B DE 4 GB (ADR-044, ADR-045, 03E_DEPLOYMENT.md §8C): cada serviço tem
# teto de memória. Somados ficam em ~2,6 GB, deixando o resto para o sistema e
# o cache de disco. O worker do planejamento roda com prioridade baixa.
# =============================================================================

services:

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    mem_limit: 640m
    environment:
      POSTGRES_DB: estudos
      POSTGRES_USER: estudos
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no arquivo .env}
      TZ: America/Sao_Paulo
    volumes:
      # ADR-019: SSD USB, NUNCA cartão SD. Um banco escreve constantemente
      # (WAL, checkpoints, autovacuum) — é o pior caso possível para SD.
      #
      # ATENÇÃO: se o SSD não estiver montado, o Docker cria a pasta vazia no
      # cartão e o Postgres sobe com uma base EM BRANCO. Falha silenciosa.
      # Confira `lsblk` antes de subir, e mantenha a montagem por UUID no
      # /etc/fstab (03E_DEPLOYMENT.md §3).
      - /mnt/ssd/postgres:/var/lib/postgresql/data
    command: >
      postgres
      -c shared_buffers=256MB
      -c work_mem=8MB
      -c maintenance_work_mem=64MB
      -c effective_cache_size=1GB
      -c max_connections=20
      -c random_page_cost=1.1
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estudos -d estudos"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  app:
    build: .
    restart: unless-stopped
    # JAVA_OPTS do Dockerfile já limita o heap a 512 MB; o resto é metaspace,
    # threads, buffers e, durante cada chamada de IA, o processo `claude` da
    # assinatura (ADR-045).
    mem_limit: 1200m
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/estudos
      DB_USER: estudos
      DB_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no arquivo .env}
      BIND_ADDRESS: 0.0.0.0
      LOG_LEVEL: INFO
      TZ: America/Sao_Paulo
      # ADR-043: análise de edital por IA. Sem a chave, a funcionalidade
      # aparece como indisponível e o resto do sistema segue normal.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-anthropic/claude-sonnet-5.5}
      # ADR-044: rotas /internal/** para o worker do planejamento (proxy de IA,
      # lacunas). Sem o token, ficam desligadas.
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?defina INTERNAL_TOKEN no arquivo .env}
      # PDFs do material, servidos em /material/** — o worker escreve, o app só lê.
      MATERIAL_DIR: /dados/material
      # Sprint 24 (ADR-046): provas e gabaritos. O app grava em entrada/ (uid 1001) e serve as
      # imagens de paginas/ (o worker grava lá, uid 1000). docs/03E_DEPLOYMENT.md §8D.
      PROVAS_DIR: /dados/provas
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - /var/log/estudos:/var/log/estudos
      - /mnt/ssd/material:/dados/material:ro
      - /mnt/ssd/provas:/dados/provas
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # ADR-044 — o worker do projeto de planejamento prepara sozinho o material do
  # concurso-alvo (03E_DEPLOYMENT.md §8C). Sem porta: só fala com o app pela rede
  # interna do Compose. O repositório do planejamento fica clonado ao lado deste.
  planejamento:
    build: ${PLANEJAMENTO_DIR:-../Plano-de-Estudos-Automatizado}
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 768m
    cpus: 1.5
    environment:
      SGE_URL: http://app:8080
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?defina INTERNAL_TOKEN no arquivo .env}
      ACERVO_DIR: /acervo/apostilas
      INDICE_DB: /acervo/indice.db
      MATERIAL_DIR: /dados/material
      # Sprint 24: o worker lê entrada/ e escreve em paginas/ (as imagens para o usuário conferir o OCR).
      PROVAS_DIR: /dados/provas
      INTERVALO_SEG: "300"
      TZ: America/Sao_Paulo
    volumes:
      # Apostilas e índice copiados do PC (indexar no Pi levaria horas). Só leitura.
      - /mnt/ssd/acervo:/acervo:ro
      # Único lugar onde o worker escreve o material; precisa pertencer ao uid 1000.
      - /mnt/ssd/material:/dados/material
      # Provas: entrada/ é do app (uid 1001), paginas/ é do worker (uid 1000).
      - /mnt/ssd/provas:/dados/provas
